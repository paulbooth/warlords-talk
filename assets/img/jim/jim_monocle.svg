<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Uncle Jim's monocle. The LENS is dead centre of this canvas (80,80), so the prop is
       pinned straight onto his measured pupil (source px 455,170 of the 896x1190
       portrait) — it sits ON the eye, not on the eyebrow. The chain swings away below. -->
  <circle cx="80" cy="80" r="36" fill="#cfe6f2" fill-opacity="0.32" stroke="#e0c469" stroke-width="8"/>
  <circle cx="80" cy="80" r="28" fill="none" stroke="#f4e2a4" stroke-width="2.6"/>
  <path d="M60 64 q10 -11 26 -11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- the chain, dangling off toward his collar -->
  <path d="M112 104 q14 24 6 44 q-8 18 -30 22" fill="none" stroke="#e0c469" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="7 6"/>
  <circle cx="110" cy="102" r="6" fill="#e0c469" stroke="#8a6412" stroke-width="2.4"/>
</svg>
