<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Uncle Jim's disguise: the classic novelty-shop Groucho — bushy brows, black frames,
       an enormous rubber nose and a mustache, all one piece. Authored so the LENS CENTRES
       (120,70) and (180,70) land on his measured pupils (source px 405,171 and 455,170 of
       the 896x1190 portrait); the placement in JimCheckinView.PROPS derives u/v/w from
       exactly those numbers. Nobody will ever know. -->
  <!-- bushy eyebrows, riding the top of the frames -->
  <path d="M86 44 Q104 22 142 34 Q126 46 108 46 Q96 47 86 44 Z"
        fill="#2c2119" stroke="#15100c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M214 44 Q196 22 158 34 Q174 46 192 46 Q204 47 214 44 Z"
        fill="#2c2119" stroke="#15100c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M94 40 q16 -10 34 -2 M206 40 q-16 -10 -34 -2" fill="none" stroke="#4a3a2a" stroke-width="3" stroke-linecap="round"/>
  <!-- frames: two big round lenses + bridge, arms running off to the temples -->
  <circle cx="120" cy="70" r="31" fill="#cfe6f2" fill-opacity="0.30" stroke="#15100c" stroke-width="7"/>
  <circle cx="180" cy="70" r="31" fill="#cfe6f2" fill-opacity="0.30" stroke="#15100c" stroke-width="7"/>
  <path d="M150 62 q-8 -6 -1 -6 M151 62 q8 -6 1 -6" fill="none" stroke="#15100c" stroke-width="7" stroke-linecap="round"/>
  <path d="M139 66 h22" fill="none" stroke="#15100c" stroke-width="7" stroke-linecap="round"/>
  <path d="M89 64 L58 56 M211 64 L242 56" fill="none" stroke="#15100c" stroke-width="6" stroke-linecap="round"/>
  <!-- lens glints -->
  <path d="M104 58 q8 -9 20 -9 M164 58 q8 -9 20 -9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- THE NOSE: a big soft rubber schnoz hanging off the bridge -->
  <path d="M150 72 Q128 84 126 112 Q124 140 150 146 Q176 140 174 112 Q172 84 150 72 Z"
        fill="#e6a486" stroke="#a5674c" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M136 96 q14 -8 28 0" fill="none" stroke="#f2c0a6" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="139" cy="134" rx="5" ry="3.4" fill="#a5674c"/>
  <ellipse cx="161" cy="134" rx="5" ry="3.4" fill="#a5674c"/>
  <!-- the mustache, glued under it: thick, black, gloriously fake -->
  <path d="M150 142
           Q134 150 112 150 Q88 150 78 138 Q84 158 104 166 Q128 174 150 160
           Q172 174 196 166 Q216 158 222 138 Q212 150 188 150 Q166 150 150 142 Z"
        fill="#2c2119" stroke="#15100c" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M110 154 q20 6 40 2 M190 154 q-20 6 -40 2" fill="none" stroke="#4a3a2a" stroke-width="3" stroke-linecap="round"/>
</svg>
