<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Uncle Jim's eyepatch, over his LEFT eye (the viewer's right one, measured at source
       px (455,170) of the 896x1190 portrait). The PATCH is dead centre of this canvas, so
       the prop is simply pinned AT that pupil. At the authored width (w=0.216) one unit
       here is about one source pixel, and the strap runs out to the sides of his HEAD
       (~x 396..571 in source) and no further — it disappears into the fur, it doesn't fly
       off into the forest. -->
  <!-- strap: long side sweeps across the brow to his far temple, short side to the ear -->
  <path d="M2 26 Q54 18 84 40" fill="none" stroke="#241f1c" stroke-width="9" stroke-linecap="round"/>
  <path d="M118 44 Q142 52 156 60" fill="none" stroke="#241f1c" stroke-width="9" stroke-linecap="round"/>
  <path d="M6 27 Q54 21 82 41" fill="none" stroke="#4a423c" stroke-width="2.6" stroke-linecap="round"/>
  <!-- the patch: worn leather, scuffed, covering the eye -->
  <path d="M82 32 Q100 24 118 32 Q126 50 118 68 Q100 76 82 68 Q74 50 82 32 Z"
        fill="#211c19" stroke="#0d0b0a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M86 38 Q100 32 114 38" fill="none" stroke="#4a423c" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M88 62 q12 5 24 0" fill="none" stroke="#4a423c" stroke-width="2.2" stroke-linecap="round"/>
  <!-- skull and crossbones, because he is not a subtle squirrel -->
  <circle cx="100" cy="47" r="6.4" fill="#e8e2d6"/>
  <rect x="96" y="52" width="8" height="4" rx="1.4" fill="#e8e2d6"/>
  <circle cx="97.8" cy="46" r="1.6" fill="#211c19"/>
  <circle cx="102.2" cy="46" r="1.6" fill="#211c19"/>
  <path d="M89 59 l22 -6 M89 53 l22 6" stroke="#e8e2d6" stroke-width="2.1" stroke-linecap="round"/>
</svg>
